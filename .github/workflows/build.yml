# Builds the Windows, Mac and Linux installers, each on its own platform, and
# publishes them as a GitHub Release named after the version in package.json
# (e.g. v0.1.0). Pushing again with the same version refreshes that release;
# bump "version" in package.json to publish a new one.
name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'claude/wizardly-bardeen-tiqs0f']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64
            files: dist/*.exe
          - os: macos-latest
            args: --mac dmg
            files: dist/*.dmg
          - os: ubuntu-latest
            args: --linux AppImage
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pixel Terrarium ${{ steps.v.outputs.version }}
          body: |
            **Windows:** download `Pixel Terrarium Setup ${{ steps.v.outputs.version }}.exe` below and double-click it.
            If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed).

            **Mac:** the `.dmg` (right-click the app → Open the first time). **Linux:** the `.AppImage` (make it executable, then run it).

            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/INSTALL.md) for the full guide.
          files: installers/*
          fail_on_unmatched_files: true

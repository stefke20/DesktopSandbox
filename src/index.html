<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Pixel Terrarium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="screen"></canvas>

  <div id="hud">
    <div id="hud-line"></div>
    <div id="hud-badges"></div>
  </div>
  <div id="colony-hud"></div>
  <div id="tooltip"></div>
  <div id="toast"></div>
  <div id="stats" class="hidden"></div>

  <div id="ui">
    <div id="panel" class="hidden"></div>
    <div id="dock">
      <button class="dock-btn" id="menu-btn" title="Main menu">☰</button>
      <select id="biome" title="Biome (B = next)"><option value="__world" hidden>🌍 World</option></select>
      <button class="dock-btn colony-only" data-tab="colony" title="Your colony: tech tree, buildings, guidance">🏛️</button>
      <button class="dock-btn" data-tab="hand" title="Hand: pick up and throw creatures (Esc)">✋</button>
      <button class="dock-btn" data-tab="paint" title="Paint elements">🖌️</button>
      <button class="dock-btn" data-tab="life" title="Create life">🐾</button>
      <button class="dock-btn" data-tab="terrain" title="Landscape & vegetation">⛰️</button>
      <button class="dock-btn" data-tab="powers" title="Godly powers">⚡</button>
      <button class="dock-btn" data-tab="events" title="Special events">🌋</button>
      <button class="dock-btn" data-tab="weather" title="Weather">🌦️</button>
      <button class="dock-btn" data-tab="time" title="Time of day">🕑</button>
      <button class="dock-btn" data-tab="log" title="Event log">📜</button>
      <button class="dock-btn" data-tab="settings" title="Settings">⚙️</button>
      <button class="dock-btn zoom-btn" id="zoom-out" title="Zoom out (-)">－</button>
      <span id="zoom-label">1×</span>
      <button class="dock-btn zoom-btn" id="zoom-in" title="Zoom in (+)">＋</button>
      <span id="tool-label"></span>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/flora.js"></script>
  <script src="js/world.js"></script>
  <script src="js/species.js"></script>
  <script src="js/species-more.js"></script>
  <script src="js/species-world.js"></script>
  <script src="js/fantasy.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/creatures.js"></script>
  <script src="js/ants.js"></script>
  <script src="js/hive.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/background.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/events.js"></script>
  <script src="js/biomes.js"></script>
  <script src="js/biomes-more.js"></script>
  <script src="js/worldgen.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/space.js"></script>
  <script src="js/civ.js"></script>
  <script src="js/space-life.js"></script>
  <script src="js/solar.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/god.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
